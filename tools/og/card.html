<!doctype html>
<!--
  Source for the 1200x630 link-preview images (og:image) in assets/images/og/.
  Regenerate with:  tools/og/render.sh
  ?card=site  -> og-site.png        ?card=moneybook -> og-moneybook.png
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fbf6ec;
    background-image:
      radial-gradient(circle at 88% 12%, rgba(224,163,59,0.30), transparent 42%),
      radial-gradient(circle at 6% 96%, rgba(194,96,58,0.20), transparent 45%);
    font-family: Inter, sans-serif; color: #2a1f16;
    display: flex; align-items: center; padding: 0 88px; gap: 64px;
  }
  .text { flex: 1; }
  .brand { font-family: Fraunces, serif; font-weight: 700; font-size: 30px; color: #a0472a; margin-bottom: 34px; }
  h1 { font-family: Fraunces, serif; font-weight: 700; font-size: 74px; line-height: 1.04; letter-spacing: -0.01em; }
  h1 em {
    font-style: italic; font-weight: 400;
    background: linear-gradient(112deg, #a0472a, #c2603a 45%, #c07a1e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { font-size: 28px; line-height: 1.4; color: #6a5949; margin-top: 26px; max-width: 700px; }
  .price { margin-top: 36px; font-family: Fraunces, serif; font-size: 26px; color: #5b6b44; }
  .icon { width: 280px; height: 280px; border-radius: 62px; box-shadow: 0 24px 60px rgba(74,48,26,0.22); }
  .card-site .icon { display: none; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">vnktsh.com</div>
    <h1 id="h"></h1>
    <p id="p"></p>
    <div class="price" id="price"></div>
  </div>
  <img class="icon" src="../../assets/images/moneybook-icon.png" alt="" />
<script>
  const cards = {
    site: {
      h: 'Apps, made like a <em>meal for friends</em>.',
      p: 'Small, useful apps given away free: no ads, no subscriptions, nothing collected.',
      price: 'Total due: 0.00',
    },
    moneybook: {
      h: 'MoneyBook',
      p: 'A free, offline expense tracker and budget app for Android and Mac. No ads, no account, nothing collected.',
      price: 'Free · Android & macOS',
    },
  };
  const key = new URLSearchParams(location.search).get('card') || 'site';
  const c = cards[key];
  document.body.className = 'card-' + key;
  document.getElementById('h').innerHTML = c.h;
  document.getElementById('p').textContent = c.p;
  document.getElementById('price').textContent = c.price;
</script>
</body>
</html>
